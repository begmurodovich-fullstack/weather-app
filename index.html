<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <div class="container">
    <div class="weather-app">
      <h1>Weather App</h1>

      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Shahar nomini kiriting">
        <button id="searchBtn" type="button">Qidirish</button>
      </div>

      <div class="weather-info">
        <h2 id="cityName">Shahar nomi</h2>
        <p id="temperature">Harorat: --°C</p>
        <p id="description">Holat: --</p>
        <p id="humidity">Namlik: --%</p>
        <p id="wind">Shamol: -- km/s</p>
      </div>
    </div>
  </div>
<script   src  =  "js/main.js?v=2"  ></script> 
  <!-- <script src="js/main.js"></script> -->
</body>
</html>
